<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MQTT UI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div class="card">
            <h2>Connection</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="host">Host</label>
                    <input type="text" id="host" placeholder="Host">
                </div>
                <div class="form-group">
                    <label for="port">Port</label>
                    <input type="text" id="port" placeholder="Port">
                </div>
                <div class="form-group">
                    <label for="clientId">Client ID</label>
                    <input type="text" id="clientId" placeholder="Client ID">
                </div>
            </div>

            <!-- <div class="form-row">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password">
                </div>
            </div> -->

            <form id="mqtt-config-form" enctype="multipart/form-data">
                <div class="file-input-group">
                    <label for="clientKey">Client Key:</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="clientKey" name="clientKey" />
                        <button type="button" class="clear-btn" onclick="clearFile('clientKey')">Clear</button>
                    </div>
                </div>

                <div class="file-input-group">
                    <label for="clientCert">Client Cert:</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="clientCert" name="clientCert" />
                        <button type="button" class="clear-btn" onclick="clearFile('clientCert')">Clear</button>
                    </div>
                </div>

                <div class="file-input-group">
                    <label for="caCert">CA Cert:</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="caCert" name="caCert" />
                        <button type="button" class="clear-btn" onclick="clearFile('caCert')">Clear</button>
                    </div>
                </div>

            </form>



            <div class="button-group">
                <button class="connect-btn">Connect</button>
                <button class="disconnect-btn">Disconnect</button>
            </div>
        </div>

        <div class="card">
            <h2>Controls</h2>
            <div class="control-box">
                <div class="form-group">
                    <label for="move-x">Move X</label>
                    <!-- Slider for Move X -->
                    <input type="range" id="move-x" min="0" max="220" value="0" step="1">
                    <span id="move-x-value">0</span> <!-- Display the current value -->
                </div>
                <button class="move-x-button">Move X</button>
            </div>
            
            <div class="control-box">
                <div class="form-group">
                    <label for="move-y">Move Y</label>
                    <!-- Slider for Move Y -->
                    <input type="range" id="move-y" min="0" max="180" value="0" step="1">
                    <span id="move-y-value">0</span> <!-- Display the current value -->
                </div>
                <button class="move-y-button">Move Y</button>
            </div>
            
            <div class="button-controls">
                <button class="laser">laser</button>
                <button class="light">Light</button>
                <button class="buzzer">Buzzer</button>
            </div>
        </div>

        <div class="card">
            <h2>Publisher</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="topic">Topic</label>
                    <input type="text" id="topic" placeholder="Topic">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="payload">Payload</label>
                    <textarea id="payload" placeholder="Payload"></textarea>
                </div>
            </div>
            <div class="button-group">
                <button class="publish-btn">Publish</button>
            </div>
        </div>



        <div class="card">
            <h2>Subscriber</h2>
            <div class="form-group">
                <label for="Subscriber">Topic</label>
                <input type="text" id="Subscriber" placeholder="Topic">
            </div>
            <div class="button-group">
                <button class="subscribe-btn">Subscribe</button>
            </div>
        </div>

        <div class="card">
            <h2>Receiver</h2>
            <div class="receiver-box" id="receiverBox">

            </div>
        </div>




    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
